<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EletroNiza - Login</title>
</head>
<body>

    <main>

        <section>
            <h1>EletroNiza</h1>
            <h2>Gerenciamento Inteligente de Armários e Ferramentas</h2>
            <p>Organização • Controle • Eficiência</p>
        </section>

        <section>
            <h2>Bem-vindo ao EletroNiza!</h2>
            <p>Faça login para acessar o sistema</p>

            <form action="#" method="post">

                <div>
                    <label for="usuario">Usuário</label>
                    <input type="text" id="usuario" name="usuario"
                           placeholder="Digite seu usuário" required>
                </div>

                <div>
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha"
                           placeholder="Digite sua senha" required>
                </div>

                <div>
                    <input type="checkbox" id="lembrar" name="lembrar">
                    <label for="lembrar">Lembrar-me</label>

                    <a href="#">Esqueceu sua senha?</a>
                </div>

                <button type="submit">Entrar</button>

            </form>

            <p>Ou</p>

            <h3>Selecione seu perfil (opcional):</h3>

            <button type="button">Desenvolvedor</button>

            <button type="button">Aluno/Funcionário</button>

            <button type="button">Professor/Chefe</button>

            <footer>
                <p>EletroNiza - Versão 1.0</p>
            </footer>

        </section>

    </main>

</body>
</html>
