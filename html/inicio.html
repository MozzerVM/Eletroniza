
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EletroNiza - Login</title>
    <link rel="stylesheet" href="css/inicio.css">
</head>
<body>

    <main>

        <section>
            <h1>EletroNiza</h1>
            <h2>Gerenciamento Inteligente de Armários e Ferramentas</h2>
            <p>Organização • Controle • Eficiência</p>
        </section>

        <section>
            <h2>Bem-vindo ao EletroNiza!</h2>
            <p>Faça login para acessar o sistema</p>

            <form id="loginForm">

                <div>
                    <label for="usuario">Usuário</label>
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Digite seu usuário"
                        required
                    >
                </div>

                <div>
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <div>
                    <input type="checkbox" id="lembrar" name="lembrar">
                    <label for="lembrar">Lembrar-me</label>

                    <a href="#">Esqueceu sua senha?</a>
                </div>

                <button type="submit" id="btnEntrar">Entrar</button>

                <p id="mensagem" role="alert"></p>

            </form>

            <p>Ou</p>

            <h3>Selecione seu perfil (opcional):</h3>

            <button type="button">Desenvolvedor</button>
            <button type="button">Aluno/Funcionário</button>
            <button type="button">Professor/Chefe</button>

            <footer>
                <p>EletroNiza - Versão 1.0</p>
            </footer>

        </section>

    </main>

    <script>
        const formulario = document.getElementById("loginForm");
        const mensagem = document.getElementById("mensagem");
        const botaoEntrar = document.getElementById("btnEntrar");

        formulario.addEventListener("submit", async function(event) {
            event.preventDefault();

            const usuario = document.getElementById("usuario").value.trim();
            const senha = document.getElementById("senha").value;

            mensagem.textContent = "Verificando acesso...";
            botaoEntrar.disabled = true;

            try {
                const resposta = await fetch("http://127.0.0.1:8000/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        usuario: usuario,
                        senha: senha
                    })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    mensagem.textContent = dados.detail || "Não foi possível fazer login.";
                    return;
                }

                // Guarda os dados básicos para identificar o usuário na interface.
                sessionStorage.setItem("usuarioId", dados.id);
                sessionStorage.setItem("usuarioNome", dados.nome);
                sessionStorage.setItem("usuarioTipo", dados.tipo);

                mensagem.textContent = "Login realizado com sucesso!";

                window.location.href = "painelinicio.html";

            } catch (erro) {
                mensagem.textContent = "Não foi possível conectar ao servidor.";
                console.error("Erro:", erro);

            } finally {
                botaoEntrar.disabled = false;
            }
        });
    </script>

</body>
</html>
